apiVersion: apps/v1
kind: Deployment
metadata:
  name: speedtest
  namespace: speedtest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speedtest
  template:
    metadata:
      labels:
        app: speedtest
    spec:
      containers:
      - name: speedtest
        image: linuxserver/librespeed:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: speedtest-service
  namespace: speedtest
spec:
  type: LoadBalancer
  selector:
    app: speedtest
  ports:
    - protocol: TCP
      port: 8888
      targetPort: 80
