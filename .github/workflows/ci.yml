name: K8s Lint and Validate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Kubernetes manifests
        run: |
          # Use 'apply' with dry-run to check syntax locally
          kubectl apply --dry-run=client -f deployment.yaml

      - name: Check for common errors
        run: |
          # Simple check to ensure both Deployment and Service exist
          grep -q "kind: Deployment" deployment.yaml || (echo "Missing Deployment!" && exit 1)
          grep -q "kind: Service" deployment.yaml || (echo "Missing Service!" && exit 1)
